name = "web-pixel-affilliate"
type = "web_pixel_extension"
uid = "ff16879e-7b72-4db3-c654-9abb1d827c54d1232da6"

runtime_context = "strict"

[settings]
type = "object"

[settings.fields.conversion_endpoint]
name = "URL de conversiones (POST)"
description = "URL completa HTTPS del endpoint POST de tu app (por ejemplo https://tu-app.com/api/conversions)."
type = "single_line_text_field"
validations = [{ name = "min", value = "8" }]

[settings.fields.conversion_hmac_secret]
name = "Secreto HMAC (opcional)"
description = "Debe coincidir con la variable CONVERSION_HMAC_SECRET del servidor. Si esta vacio, no se envia firma."
type = "single_line_text_field"
