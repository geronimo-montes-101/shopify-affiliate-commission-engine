name: Deploy Shopify App (Dev)

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Shopify CLI
        run: npm install --global @shopify/cli@latest

      - name: Verify Shopify CLI
        run: shopify version

      - name: Deploy app to Shopify
        run: npm run deploy -- --force
        env:
          CI: "1"
          SHOPIFY_CLI_PARTNERS_TOKEN: ${{ secrets.SHOPIFY_CLI_PARTNERS_TOKEN_DEV }}
          SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY_DEV }}
          SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET_DEV }}
